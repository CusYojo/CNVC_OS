interface:
  display_name: "生成尽调报告"
  short_description: "先研读项目，再按德塔标准模板生成尽调报告"
  default_prompt: "使用 $write-due-diligence-report，以投资中台资深投资经理身份，仅针对当前会话绑定项目生成中文尽调报告。先逐份研读项目文件并建立事实、时间线、冲突和表格候选，再严格按 docs/尽调报告/德塔智能尽职调查报告(1).pdf 的八个一级部分、30 个内容模块、表格密度和版式生成可编辑 DOCX。模板只控制结构和样式，不复制模板项目事实；正文不得出现内部项目阶段、检索过程、生成过程或技术错误。"
