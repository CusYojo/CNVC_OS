interface:
  display_name: "生成尽调报告"
  short_description: "资深投资经理基于当前项目生成内部尽调报告"
  default_prompt: "使用 $write-due-diligence-report，以投资中台资深投资经理身份，仅针对当前会话绑定的线索池或项目库项目生成内部中文尽调报告；先检索本地项目资料库和当前项目缓存，再由 Flue 发现候选来源、LLM Gateway 打开并核验页面。正文按八个固定章组独立生成、最多三个并行，再按十六模块模板顺序合并并统一复核；截断、超时或 Reviewer 问题只重试受影响章组。严格按模块语义归类内容，产品章节提炼具名产品和技术，财务章节使用有期间与口径的表格或完整分析。正文直接写项目事实、判断和动作，不解释资料处理过程；异常时删除不安全内容并继续生成受限 DOCX。"
