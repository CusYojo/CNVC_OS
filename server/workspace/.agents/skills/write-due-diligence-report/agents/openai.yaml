interface:
  display_name: "生成尽调报告"
  short_description: "资深投资经理基于当前项目生成内部尽调报告"
  default_prompt: "使用 $write-due-diligence-report，以投资中台资深投资经理身份，仅针对当前会话绑定项目生成内部中文尽调报告；先检索本地项目资料库和当前项目缓存，再由 Flue 发现候选来源、LLM Gateway 打开并核验页面。生成前先把全部证据消化为内部事实卡，统一主体、时间、关系、事件阶段和数字口径；正文按八个固定章组生成并按十六模块模板顺序合并。客户可见文字直接写主体、事实、判断、边界和动作，不得出现项目资料、资料库、现有资料、根据资料、证据处理或检索过程；叙述采用 docs/尽调报告 模板的自然长段落和投资经理语气，避免 AI 套话、宣传词及机械重复句式。"
