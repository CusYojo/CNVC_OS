interface:
  display_name: "生成尽调报告"
  short_description: "资深投资经理基于当前项目生成内部尽调报告"
  default_prompt: "使用 $write-due-diligence-report，以投资中台资深投资经理身份，仅针对当前会话绑定项目生成内部中文尽调报告；先检索本地项目资料库和当前项目缓存，再由 Flue 发现候选来源、LLM Gateway 打开并核验页面。生成前先把全部证据消化为内部事实卡，统一主体、时间、关系、事件阶段和数字口径。处置结论只在执行摘要中结合具体项目事实自然表达一次，不显示“阶段与推进建议”或“主建议”标签，不要求所有报告以固定建议句开头，投资概要不重复处置句。参考 docs/尽调报告 的人工文风，以公司、人物、产品、日期、事件和数字组织正文；事实可以直接陈述，不在每段后补投资结论。不得反复使用“该信息/该信号/该口径”“但/若/尚未/仍需”，也不得跨模块复用“直接关系到/将直接影响/投资团队应据此”等决策套句。中文与相邻英文单词或英文缩写之间不留空格，如“AI医疗”“FDE团队”；英文短语内部空格保留。"
