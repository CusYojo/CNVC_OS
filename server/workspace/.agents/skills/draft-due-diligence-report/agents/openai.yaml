interface:
  display_name: "上会尽职调查报告"
  short_description: "以尽调完成后的投资经理视角生成上会尽调报告"
  default_prompt: "使用 $draft-due-diligence-report 读取本任务全部资料目录和新增单文件，先建立本轮/历史轮次交易版本登记表与证据台账，再以投资经理视角生成DOCX与PDF；用户明确已决定投资时使用final-investment-decision。行业和投资价值需形成充分分析，团队逐人写履历，组织架构图覆盖关键节点，2.7只列资质认证荣誉，3.1分开核心产品与核心技术，预测表删除无数据年份，历史财务按利润表/资产负债表/现金流量表分组。严格来源、语义、渲染和配对门禁全部通过后交付。"
