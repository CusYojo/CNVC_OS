version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: cybernaut-pg
    environment:
      POSTGRES_USER: cybernaut
      POSTGRES_PASSWORD: cyb_mvp_2026
      POSTGRES_DB: cybernaut_mvp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybernaut -d cybernaut_mvp"]
      interval: 5s
      timeout: 5s
      retries: 5
  searxng:
    image: searxng/searxng:latest
    container_name: cybernaut-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-cybernaut-local-search-change-in-production}
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng

volumes:
  pgdata:
  searxng-cache:
