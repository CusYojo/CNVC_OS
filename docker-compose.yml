services:
  mysql:
    image: mysql:8.0
    container_name: cybernaut-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cybernaut_mvp}
      MYSQL_USER: ${DB_USERNAME:-cybernaut}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
