version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: cybernaut-pg
    environment:
      POSTGRES_USER: cybernaut
      POSTGRES_PASSWORD: cyb_mvp_2026
      POSTGRES_DB: cybernaut_mvp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybernaut -d cybernaut_mvp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
