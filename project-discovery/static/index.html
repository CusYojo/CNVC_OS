<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>项目发现雷达</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }
    .shell { max-width: 1440px; margin: 0 auto; padding: 24px; }
    .topbar {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
      margin-bottom: 18px;
    }
    h1 { font-size: 24px; margin: 0 0 6px; }
    h2 { font-size: 20px; margin: 0; }
    h3 { font-size: 15px; margin: 18px 0 8px; }
    .sub { color: #667085; font-size: 14px; line-height: 1.55; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    button {
      border: 1px solid #d0d5dd; background: white; color: #172033;
      padding: 9px 14px; border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    button.primary { background: #1769e0; border-color: #1769e0; color: white; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
    .card {
      background: white; border: 1px solid #e4e7ec; border-radius: 8px; padding: 16px;
      box-shadow: 0 1px 2px rgba(16,24,40,.04);
    }
    .stat-label { color: #667085; font-size: 13px; }
    .stat-value { font-size: 28px; font-weight: 750; margin-top: 6px; }
    .filters { display: grid; grid-template-columns: 1fr 150px 140px 120px 120px 120px; gap: 10px; margin-bottom: 14px; }
    input, select {
      width: 100%; border: 1px solid #d0d5dd; border-radius: 6px; padding: 9px 10px; background: white;
      font-size: 14px;
    }
    label { color: #344054; font-size: 13px; font-weight: 650; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
    th, td { border-bottom: 1px solid #eaecf0; padding: 12px; text-align: left; vertical-align: top; }
    th { color: #667085; font-size: 12px; background: #f9fafb; }
    .title { font-weight: 700; color: #174ea6; cursor: pointer; margin-top: 6px; line-height: 1.45; }
    .muted { color: #667085; font-size: 12px; margin-top: 4px; line-height: 1.5; }
    .tag {
      display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 12px;
      background: #eef4ff; color: #175cd3; margin: 0 4px 4px 0;
    }
    .tag.red { background: #fef3f2; color: #b42318; }
    .tag.green { background: #ecfdf3; color: #067647; }
    .tag.gold { background: #fffaeb; color: #b54708; }
    .tag.gray { background: #f2f4f7; color: #475467; }
    .score { font-weight: 750; font-size: 18px; }
    .bar { height: 6px; background: #eaecf0; border-radius: 999px; margin-top: 6px; width: 90px; }
    .bar > span { display: block; height: 100%; border-radius: 999px; background: #1769e0; }
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(15,23,42,.42); padding: 40px 18px;
      overflow: auto; z-index: 20;
    }
    .modal.open { display: block; }
    .panel { max-width: 920px; margin: 0 auto; background: white; border-radius: 10px; padding: 20px; }
    .wide-panel { max-width: 1180px; }
    .panel-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .summary { line-height: 1.75; color: #344054; }
    .article-body {
      border: 1px solid #eaecf0; border-radius: 8px; padding: 16px 18px; background: #fff;
      font-size: 15px; max-width: 760px;
    }
    .article-body p { margin: 0 0 12px; }
    .article-body p:last-child { margin-bottom: 0; }
    .article-body .article-heading {
      margin-top: 18px; margin-bottom: 8px; font-weight: 750; color: #172033;
    }
    .article-body .article-table-row {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px; background: #f9fafb; border-radius: 6px; padding: 7px 9px;
      overflow-wrap: anywhere;
    }
    .signals { display: grid; gap: 8px; margin: 12px 0; }
    .signal { border: 1px solid #eaecf0; border-radius: 6px; padding: 10px; background: #fcfcfd; }
    .profile-grid { display: grid; grid-template-columns: 132px 1fr; gap: 0; margin-top: 8px; border: 1px solid #eaecf0; border-radius: 6px; overflow: hidden; }
    .profile-key, .profile-value { padding: 8px 10px; border-bottom: 1px solid #eaecf0; font-size: 13px; line-height: 1.55; }
    .profile-key { background: #f9fafb; color: #475467; font-weight: 700; }
    .profile-value { color: #344054; }
    .profile-key:nth-last-child(2), .profile-value:last-child { border-bottom: 0; }
    .dim-grid { display: grid; gap: 6px; margin-top: 8px; }
    .dim-row { display: grid; grid-template-columns: 150px 60px 1fr; gap: 8px; align-items: center; font-size: 13px; }
    .dim-bar { height: 6px; background: #eaecf0; border-radius: 999px; overflow: hidden; }
    .dim-bar span { display: block; height: 100%; background: #1769e0; }
    .run-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .source-toolbar { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin: 14px 0; }
    .school-grid { display: grid; gap: 10px; max-height: 62vh; overflow: auto; padding-right: 4px; }
    .school-row {
      display: grid; grid-template-columns: 140px 120px 1fr 1.7fr; gap: 10px; align-items: center;
      border: 1px solid #eaecf0; border-radius: 8px; padding: 10px; background: #fcfcfd;
    }
    .school-name { font-weight: 750; }
    .status-line { min-height: 22px; color: #667085; font-size: 13px; margin-top: 10px; }
    .auto-card { margin-bottom: 14px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .auto-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
    @media (max-width: 980px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filters, .run-grid, .school-row { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; }
      .actions { justify-content: flex-start; }
      table { font-size: 13px; }
      th:nth-child(3), td:nth-child(3) { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div>
        <h1>项目发现雷达</h1>
        <div class="sub">每日拉取高校和机构公众号、多渠道创投/科技信息，用一级市场投研 skill 过滤二级市场噪音，并按可投资性、技术差异化、团队机构、市场、验证、时间窗口和来源可信度打分保留。</div>
      </div>
      <div class="actions">
        <button onclick="loadData()">刷新</button>
        <button onclick="openSources()">公众号来源</button>
        <button onclick="runWechat()">抽取近7天公众号</button>
        <button onclick="runInvestment()">抓取多渠道</button>
        <button class="primary" onclick="openRun()">抓取 arXiv</button>
      </div>
    </div>

    <div class="stats">
      <div class="card"><div class="stat-label">候选池线索</div><div class="stat-value" id="total">0</div></div>
      <div class="card"><div class="stat-label">保留线索</div><div class="stat-value" id="attention">0</div></div>
      <div class="card"><div class="stat-label">平均一级市场分</div><div class="stat-value" id="avg">0</div></div>
      <div class="card"><div class="stat-label">数据目录</div><div class="muted" id="dataFile">-</div></div>
    </div>

    <div class="card auto-card">
      <div>
        <div class="stat-label">实时循环抓取</div>
        <div id="autoTitle" style="font-weight:750;margin-top:4px">加载中...</div>
        <div class="auto-meta muted" id="autoMeta"></div>
      </div>
      <button onclick="runAutoNow()">立即跑一轮</button>
    </div>

    <div class="card auto-card">
      <div>
        <div class="stat-label">公众号每日抽取</div>
        <div id="wechatDailyTitle" style="font-weight:750;margin-top:4px">加载中...</div>
        <div class="auto-meta muted" id="wechatDailyMeta"></div>
      </div>
      <button onclick="runWechat()">立即抽取近7天</button>
    </div>

    <div class="card">
      <div class="filters">
        <input id="q" placeholder="搜索标题、摘要、作者、院校、公众号、信号" onkeydown="if(event.key==='Enter') loadData()" />
        <select id="sourceFilter">
          <option value="">全部来源</option>
          <option value="arxiv">arXiv</option>
          <option value="wechat_api">公众号文章</option>
          <option value="wechat_chat">微信群聊</option>
          <option value="investment">投资线索</option>
          <option value="investment:36kr_pitchhub_financing_flash">36Kr PitchHub 融资快报</option>
        </select>
        <select id="groupFilter">
          <option value="">全部分组</option>
          <option value="论文">论文</option>
          <option value="专利">专利</option>
          <option value="高校成果">高校成果</option>
          <option value="创投新闻">创投新闻</option>
          <option value="海外项目">海外项目</option>
          <option value="高校公众号">高校公众号</option>
          <option value="机构公众号">机构公众号</option>
          <option value="微信群聊">微信群聊</option>
        </select>
        <input id="minScore" type="number" min="0" max="100" value="0" />
        <select id="attentionOnly">
          <option value="true" selected>只看保留</option>
          <option value="false">全部线索</option>
        </select>
        <button onclick="loadData()">应用筛选</button>
      </div>

      <table>
        <thead>
          <tr>
            <th style="width: 48%">线索</th>
            <th style="width: 120px">一级市场分</th>
            <th>项目画像</th>
            <th>评分维度 / 信号</th>
            <th style="width: 170px">发布时间</th>
            <th style="width: 90px">操作</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6">加载中...</td></tr>
        </tbody>
      </table>
      <div class="status-line" id="wechatStatus"></div>
    </div>
  </div>

  <div class="modal" id="detailModal">
    <div class="panel">
      <div class="panel-head">
        <h2 id="detailTitle"></h2>
        <button onclick="closeDetail()">关闭</button>
      </div>
      <div id="detailMeta" class="muted" style="margin-top:8px"></div>
      <div id="detailSignals" class="signals"></div>
      <h3 id="detailContentTitle">正文/摘要</h3>
      <div id="detailSummary" class="summary"></div>
    </div>
  </div>

  <div class="modal" id="runModal">
    <div class="panel">
      <div class="panel-head">
        <h2>抓取 arXiv</h2>
        <button onclick="closeRun()">关闭</button>
      </div>
      <div class="run-grid" style="margin-top:14px">
        <label>分类<input id="categories" value="cs.AI,cs.CL,cs.CV,cs.LG" /></label>
        <label>关键词<input id="keywords" placeholder="robotics,drug discovery,LLM" /></label>
        <label>最近天数<input id="days" type="number" min="1" max="90" value="14" /></label>
        <label>抓取数量<input id="maxResults" type="number" min="1" max="100" value="20" /></label>
      </div>
      <label style="display:block;margin-top:10px">重点作者名单<input id="watchAuthors" placeholder="Author One,Author Two" /></label>
      <div style="margin-top:14px">
        <button class="primary" id="runBtn" onclick="runArxiv()">开始抓取</button>
        <span class="muted" id="runStatus"></span>
      </div>
    </div>
  </div>

  <div class="modal" id="sourcesModal">
    <div class="panel wide-panel">
      <div class="panel-head">
        <div>
          <h2>公众号来源</h2>
          <div class="sub">来源文件：公众号来源.xlsx；接口参数使用第二列帐号名。</div>
        </div>
        <button onclick="closeSources()">关闭</button>
      </div>
      <div class="source-toolbar">
        <div class="muted" id="sourceMeta">加载中...</div>
        <div>
          <button onclick="setAccountGroup('高校')">高校</button>
          <button onclick="setAccountGroup('机构')">机构</button>
          <button class="primary" onclick="loadSources()">重新加载</button>
        </div>
      </div>
      <div class="school-grid" id="sourcesList"></div>
      <div class="status-line" id="sourceStatus"></div>
    </div>
  </div>

  <script>
    let items = [];
    let sources = [];
    let activeAccountGroup = '高校';

    function esc(text) {
      return String(text || '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }

    function fmtDate(value) {
      if (!value) return '-';
      const d = new Date(value);
      return Number.isNaN(d.getTime()) ? value : d.toLocaleString('zh-CN', { hour12: false });
    }

    function fmtInterval(seconds) {
      const mins = Math.round(Number(seconds || 0) / 60);
      return mins ? `${mins} 分钟` : `${seconds || 0} 秒`;
    }

    function splitCsv(value) {
      return String(value || '').split(',').map(x => x.trim()).filter(Boolean);
    }

    const signalLabels = {
      private_market_fit: '一级市场匹配',
      differentiation: '技术差异化',
      team_institution: '团队/高校机构',
      market_urgency: '市场需求',
      traction: '客户/融资验证',
      timing: '时间窗口',
      source_quality: '来源可信度',
      top_venue: '顶会/顶刊',
      major_funding: '重大基金支持',
      affiliation_985: '985院校',
      watch_author_first_second: '重点作者位次',
      artifact_available: '代码/模型/数据可用',
      project_keyword: '项目关键词',
      source_985_wechat: '985公众号来源',
      secondary_market_context: '二级市场上下文',
      filtered_reason: '过滤原因',
      university_tech_value: '高校科技价值',
      private_market_retention_boost: '保留加分',
      wechat_chat_hint: '群聊投资线索',
    };

    const disclosureLabels = {
      round_or_stage: '轮次/阶段',
      amount_or_valuation: '金额/估值',
      investors: '投资方',
      ownership_or_cap_table: '股权/股东',
      revenue_or_customers: '收入/客户',
    };

    function signalLabel(code) {
      return signalLabels[code] || code || '未知信号';
    }

    function disclosureLabel(key) {
      return disclosureLabels[key] || key;
    }

    function renderArticleContent(text) {
      const lines = String(text || '').split(/\n+/).map(x => x.trim()).filter(Boolean);
      if (!lines.length) return '<div class="muted">暂无正文或摘要</div>';
      return `<div class="article-body">${lines.map((line, idx) => {
        const compact = line.replace(/\s+/g, '');
        const isTable = line.includes(' | ');
        const isHeading = !isTable && compact.length <= 34 && (
          idx === 0 ||
          /^(\\d+|[一二三四五六七八九十]+)[、.．]/.test(compact) ||
          /[:：]$/.test(compact) ||
          /(成果|导读|核心亮点|风险提示|研究背景|项目简介|团队介绍|融资信息)$/.test(compact)
        );
        const cls = isTable ? 'article-table-row' : isHeading ? 'article-heading' : '';
        return `<p class="${cls}">${esc(line)}</p>`;
      }).join('')}</div>`;
    }

    function signalClass(code) {
      if (code === 'top_venue') return 'red';
      if (code === 'major_funding') return 'gold';
      if (code === 'artifact_available' || code === 'project_keyword' || code === 'private_market_fit' || code === 'traction' || code === 'private_market_retention_boost' || code === 'university_tech_value') return 'green';
      if (code === 'source_985_wechat' || code === 'source_quality' || code === 'secondary_market_context') return 'gray';
      if (code === 'filtered_reason') return 'red';
      return '';
    }

    function decisionClass(decision) {
      if (decision === 'high_priority') return 'red';
      if (decision === 'watchlist') return 'green';
      if (decision === 'low_priority') return 'gold';
      if (decision === 'filter') return 'gray';
      return '';
    }

    function decisionLabel(item) {
      return item.decision_label || (item.worth_attention ? '保留' : '未保留');
    }

    function renderDimensionTags(item) {
      const dims = (item.score_dimensions || [])
        .filter(d => Number(d.score || 0) > 0)
        .sort((a, b) => Number(b.score || 0) - Number(a.score || 0))
        .slice(0, 4);
      if (dims.length) {
        return dims.map(d => `<span class="tag" title="${esc(d.detail || '')}">${esc(d.label || d.code)} ${esc(d.score)}/${esc(d.max_score)}</span>`).join('');
      }
      return (item.signals || []).slice(0, 4).map(s => `<span class="tag ${signalClass(s.code)}" title="${esc(s.detail)}">${esc(signalLabel(s.code))}</span>`).join('') || '<span class="muted">暂无强信号</span>';
    }

    function renderDimensions(item) {
      const dims = item.score_dimensions || [];
      if (!dims.length) return '<div class="muted">暂无维度分。</div>';
      return `<div class="dim-grid">${dims.map(d => {
        const pct = Math.round((Number(d.score || 0) / Math.max(1, Number(d.max_score || 1))) * 100);
        return `<div class="dim-row"><div>${esc(d.label || d.code)}</div><b>${esc(d.score)}/${esc(d.max_score)}</b><div class="dim-bar"><span style="width:${Math.min(100, pct)}%"></span></div></div>`;
      }).join('')}</div>`;
    }

    function renderDisclosure(item) {
      const data = item.disclosure_status || {};
      const keys = Object.keys(data);
      if (!keys.length) return '<div class="muted">暂无披露状态。</div>';
      return keys.map(k => `<div><b>${esc(disclosureLabel(k))}</b>：${esc(data[k])}</div>`).join('');
    }

    function renderProfileSummary(item) {
      const p = item.project_profile || {};
      const rows = [];
      if (item.source === 'arxiv') {
        rows.push(`论文：${p.paper_first_author || item.first_author || '-'} / ${p.paper_venue || 'arXiv'}`);
        rows.push(`方向：${p.paper_categories || (item.categories || []).join('、') || '-'}`);
      } else {
        rows.push(`轮次：${p.project_round || '-'}`);
        rows.push(`估值：${p.latest_valuation || '-'}`);
        rows.push(`机构：${p.institutions || '-'}`);
        rows.push(`行业：${p.industry || '-'}`);
      }
      return rows.map(x => `<div class="muted">${esc(x)}</div>`).join('');
    }

    function renderProjectProfile(item) {
      const p = item.project_profile || {};
      if (!Object.keys(p).length) return '<div class="muted">暂无项目画像。</div>';
      const fields = item.source === 'arxiv'
        ? [
            ['论文标题', p.paper_title || item.title],
            ['作者', p.paper_authors],
            ['第一作者', p.paper_first_author],
            ['第二作者', p.paper_second_author],
            ['分类方向', p.paper_categories],
            ['期刊/会议', p.paper_venue],
            ['论文备注', p.paper_comment],
            ['核心亮点', p.core_highlights],
            ['风险提示', p.risk_notes],
            ['PDF', p.paper_pdf_url],
          ]
        : [
            ['项目名称', p.project_name],
            ['项目轮次', p.project_round],
            ['融资金额', p.financing_amount],
            ['最新估值', p.latest_valuation],
            ['机构', p.institutions],
            ['行业', p.industry],
            ['核心亮点', p.core_highlights],
            ['风险提示', p.risk_notes],
            ['人员构成', p.team_composition],
            ['实验室', p.lab],
            ['联系方式', p.contact],
          ];
      return `<div class="profile-grid">${fields
        .filter(([, value]) => value !== undefined && value !== null && String(value).trim() !== '')
        .map(([label, value]) => `<div class="profile-key">${esc(label)}</div><div class="profile-value">${esc(value)}</div>`)
        .join('')}</div>`;
    }

    function sourceLabel(item) {
      if (item.source === 'wechat_api') return item.source_group || '公众号文章';
      if (item.source === 'wechat_chat') return '微信群聊';
      if (item.source === 'investment') return item.source_group || '投资线索';
      return item.source === 'wechat_985' ? '985公众号' : 'arXiv';
    }

    function itemMeta(item) {
      if (item.source === 'wechat_chat') {
        return [item.group_name, item.sender_name, item.key_message_time].filter(Boolean).join(' · ') || '微信群聊';
      }
      if (item.source === 'wechat_api') {
        return [item.account_name, item.wx_name].filter(Boolean).join(' · ') || '公众号文章';
      }
      if (item.source === 'investment') {
        return [item.source_group, item.source_name].filter(Boolean).join(' · ') || '多渠道';
      }
      if (item.source === 'wechat_985') {
        return [item.school, item.account_name].filter(Boolean).join(' · ') || '985 公众号';
      }
      return (item.authors || []).slice(0, 5).join(', ');
    }

    async function api(path, options) {
      const res = await fetch(path, options);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function loadData() {
      const q = document.getElementById('q').value;
      const minScore = document.getElementById('minScore').value || 0;
      const attentionOnly = document.getElementById('attentionOnly').value;
      const selectedSource = document.getElementById('sourceFilter').value;
      const [source, sourceKey = ''] = selectedSource.split(':');
      const group = document.getElementById('groupFilter').value;
      const query = new URLSearchParams({ q, min_score: minScore, attention_only: attentionOnly, source, source_key: sourceKey, group });
      const [summary, list] = await Promise.all([
        api('/api/summary'),
        api(`/api/candidates?${query.toString()}`)
      ]);
      document.getElementById('total').textContent = summary.total;
      document.getElementById('attention').textContent = summary.worth_attention;
      document.getElementById('avg').textContent = summary.avg_score;
      document.getElementById('dataFile').textContent = summary.data_file;
      items = list.items || [];
      renderTable();
      loadAutoStatus().catch(() => {});
      loadWechatDailyStatus().catch(() => {});
    }

    async function loadAutoStatus() {
      const status = await api('/api/auto/status');
      const result = status.last_result || {};
      document.getElementById('autoTitle').textContent = status.running ? '抓取中' : '运行中';
      document.getElementById('autoMeta').innerHTML = [
        `分组：${esc((status.groups || []).join('、') || '-')}`,
        `间隔：${fmtInterval(status.interval_seconds)}`,
        `上次完成：${fmtDate(status.last_finished_at)}`,
        `抓取：${result.fetched ?? '-'}`,
        `保留：${result.retained ?? result.worth_attention ?? '-'}`,
        `过滤：${result.filtered ?? '-'}`,
        `新增：${result.written ?? '-'}`,
        `失败源：${result.errors ?? '-'}`,
        `下次：${fmtDate(status.next_run_at)}`,
        status.last_error ? `错误：${esc(status.last_error)}` : ''
      ].filter(Boolean).join(' · ');
    }

    async function loadWechatDailyStatus() {
      const status = await api('/api/wechat-api/daily-status');
      const result = status.last_result || {};
      document.getElementById('wechatDailyTitle').textContent = status.running ? '抽取中' : '运行中';
      document.getElementById('wechatDailyMeta').innerHTML = [
        `时间：每日 ${String(status.run_hour).padStart(2, '0')}:${String(status.run_minute).padStart(2, '0')} 北京时间`,
        `范围：近 ${status.days || 7} 天`,
        `上次日期：${esc(status.last_target_date || '-')} 至 ${esc(status.last_date_end || '-')}`,
        `账号：${result.accounts ?? '-'}`,
        `文章：${result.fetched ?? '-'}`,
        `保留：${result.retained ?? result.worth_attention ?? '-'}`,
        `过滤：${result.filtered ?? '-'}`,
        `新增：${result.written ?? '-'}`,
        `失败账号：${result.errors ?? '-'}`,
        `下次：${fmtDate(status.next_run_at)}`,
        status.last_error ? `错误：${esc(status.last_error)}` : ''
      ].filter(Boolean).join(' · ');
    }

    function renderTable() {
      const tbody = document.getElementById('tbody');
      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="6">暂无线索，可先抓取多渠道或 arXiv；公众号需要先配置 feed。</td></tr>';
        return;
      }
      tbody.innerHTML = items.map((item, idx) => `
        <tr>
          <td>
            <div>
              <span class="tag ${item.source === 'wechat_985' ? 'gray' : item.source === 'investment' || item.source === 'wechat_api' || item.source === 'wechat_chat' ? 'green' : ''}">${sourceLabel(item)}</span>
              <span class="tag ${decisionClass(item.decision)}">${esc(decisionLabel(item))}</span>
              ${(item.categories || []).slice(0, 3).map(x => `<span class="tag">${esc(x)}</span>`).join('')}
            </div>
            <div class="title" onclick="openDetail(${idx})">${esc(item.title)}</div>
            <div class="muted">${esc(itemMeta(item))}</div>
          </td>
          <td>
            <div class="score">${item.attention_score || 0}</div>
            <div class="bar"><span style="width:${Math.min(100, item.attention_score || 0)}%"></span></div>
          </td>
          <td>${renderProfileSummary(item)}</td>
          <td>${renderDimensionTags(item)}</td>
          <td>${fmtDate(item.published_at)}</td>
          <td>${item.link ? `<button onclick="window.open('${esc(item.link)}','_blank')">来源</button>` : '<span class="muted">无链接</span>'}</td>
        </tr>
      `).join('');
    }

    function openDetail(idx) {
      const item = items[idx];
      let meta = `第一作者：${esc(item.first_author || '-')} · 第二作者：${esc(item.second_author || '-')} · 分类：${esc((item.categories || []).join(', ') || '-')} · 发布时间：${fmtDate(item.published_at)}`;
      if (item.source === 'wechat_985') {
        meta = `院校：${esc(item.school || '-')} · 公众号：${esc(item.account_name || '-')} · 发布时间：${fmtDate(item.published_at)}`;
      }
      if (item.source === 'investment') {
        meta = `来源：${esc(item.source_group || '-')} · ${esc(item.source_name || '-')} · 类型：${esc(item.source_type || '-')} · 发布时间：${fmtDate(item.published_at)}`;
      }
      if (item.source === 'wechat_api') {
        meta = `公众号：${esc(item.account_name || '-')} · 帐号名：${esc(item.wx_name || '-')} · 分组：${esc(item.source_group || '-')} · 发布时间：${fmtDate(item.published_at)}`;
      }
      if (item.source === 'wechat_chat') {
        meta = `群：${esc(item.group_name || '-')} · 提出人：${esc(item.sender_name || '-')} · 时间：${fmtDate(item.key_message_time || item.published_at)} · 商户：${esc(item.merchant_no || '-')}`;
      }
      document.getElementById('detailTitle').textContent = item.title || '';
      document.getElementById('detailMeta').innerHTML = meta;
      const thesis = item.private_market_thesis ? `<div class="signal"><b>投研判断：${esc(decisionLabel(item))}</b><div>${esc(item.private_market_thesis)}</div></div>` : '';
      const profile = `<div class="signal"><b>${item.source === 'arxiv' ? '论文信息' : '项目画像'}</b>${renderProjectProfile(item)}</div>`;
      const dimensions = `<div class="signal"><b>多维度评分</b>${renderDimensions(item)}</div>`;
      const disclosure = `<div class="signal"><b>披露状态</b><div style="margin-top:8px">${renderDisclosure(item)}</div></div>`;
      const actions = (item.next_actions || []).length
        ? `<div class="signal"><b>下一步尽调动作</b><ol>${item.next_actions.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>`
        : '';
      const filters = (item.filter_reasons || []).length
        ? `<div class="signal"><b>过滤/降权原因</b><div>${esc(item.filter_reasons.join('；'))}</div></div>`
        : '';
      const rawSignals = (item.signals || []).length
        ? `<div class="signal"><b>原始信号</b><div style="margin-top:8px">${item.signals.map(s => `<span class="tag ${signalClass(s.code)}" title="${esc(s.detail)}">${esc(signalLabel(s.code))} ${s.score ? '+' + esc(s.score) : ''}</span>`).join('')}</div></div>`
        : '<div class="muted">暂无强关注信号。</div>';
      document.getElementById('detailSignals').innerHTML = thesis + profile + dimensions + disclosure + actions + filters + rawSignals;
      const articleText = item.article_text || item.summary || '';
      const articleStatus = item.article_fetch_status ? `（${item.article_fetch_status}）` : '';
      document.getElementById('detailContentTitle').textContent = item.article_text ? `正文 ${item.article_text_length || ''} 字` : `摘要 ${articleStatus}`;
      document.getElementById('detailSummary').innerHTML = renderArticleContent(articleText);
      document.getElementById('detailModal').classList.add('open');
    }

    function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }
    function openRun() { document.getElementById('runModal').classList.add('open'); }
    function closeRun() { document.getElementById('runModal').classList.remove('open'); }
    function closeSources() { document.getElementById('sourcesModal').classList.remove('open'); }

    async function runArxiv() {
      const btn = document.getElementById('runBtn');
      const status = document.getElementById('runStatus');
      btn.disabled = true;
      status.textContent = ' 抓取中...';
      try {
        const result = await api('/api/arxiv/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            categories: splitCsv(document.getElementById('categories').value),
            keywords: splitCsv(document.getElementById('keywords').value),
            days: Number(document.getElementById('days').value || 14),
            max_results: Number(document.getElementById('maxResults').value || 20),
            watch_authors: splitCsv(document.getElementById('watchAuthors').value),
          })
        });
        status.textContent = ` 完成：抓取 ${result.fetched} 条，保留 ${result.retained ?? result.worth_attention} 条，过滤 ${result.filtered ?? 0} 条，新增 ${result.written} 条`;
        await loadData();
      } catch (e) {
        status.textContent = ' 抓取失败：' + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    async function runWechat() {
      const status = document.getElementById('wechatStatus');
      status.textContent = '公众号近7天文章抽取中...';
      try {
        const result = await api('/api/wechat-api/run-yesterday', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ groups: ['高校', '机构'], days: 7, limit_per_account: 100 })
        });
        const r = result.last_result || {};
        status.textContent = `公众号抽取完成：账号 ${r.accounts ?? 0} 个，文章 ${r.fetched ?? 0} 条，保留 ${r.retained ?? r.worth_attention ?? 0} 条，过滤 ${r.filtered ?? 0} 条，新增 ${r.written ?? 0} 条，失败账号 ${r.errors ?? 0} 个`;
        document.getElementById('sourceFilter').value = 'wechat_api';
        document.getElementById('groupFilter').value = '';
        await loadData();
      } catch (e) {
        status.textContent = '公众号抽取失败：' + e.message;
      }
    }

    async function runInvestment() {
      const status = document.getElementById('wechatStatus');
      status.textContent = '多渠道抓取中...';
      try {
        const result = await api('/api/investment/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ max_entries_per_source: 15, keyword: '人工智能' })
        });
        const err = result.errors && result.errors.length ? `，失败源 ${result.errors.length} 个` : '';
        status.textContent = `多渠道完成：源 ${result.sources} 个，抓取 ${result.fetched} 条，保留 ${result.retained ?? result.worth_attention} 条，过滤 ${result.filtered ?? 0} 条，新增 ${result.written} 条${err}`;
        document.getElementById('sourceFilter').value = 'investment';
        document.getElementById('groupFilter').value = '';
        await loadData();
      } catch (e) {
        status.textContent = '多渠道抓取失败：' + e.message;
      }
    }

    async function runAutoNow() {
      const status = document.getElementById('wechatStatus');
      status.textContent = '自动抓取立即执行中...';
      try {
        const result = await api('/api/auto/run-now', { method: 'POST' });
        const r = result.last_result || {};
        status.textContent = `自动抓取完成：抓取 ${r.fetched ?? 0} 条，保留 ${r.retained ?? r.worth_attention ?? 0} 条，过滤 ${r.filtered ?? 0} 条，新增 ${r.written ?? 0} 条，失败源 ${r.errors ?? 0} 个`;
        await loadData();
      } catch (e) {
        status.textContent = '自动抓取失败：' + e.message;
      }
    }

    async function openSources() {
      document.getElementById('sourcesModal').classList.add('open');
      await loadSources();
    }

    function setAccountGroup(group) {
      activeAccountGroup = group;
      renderSources();
    }

    async function loadSources() {
      const meta = document.getElementById('sourceMeta');
      const list = document.getElementById('sourcesList');
      meta.textContent = '加载中...';
      list.innerHTML = '';
      try {
        const result = await api('/api/wechat-api/accounts');
        sources = result.accounts || [];
        const groups = result.groups || {};
        meta.textContent = `高校 ${groups['高校'] || 0} 个，机构 ${groups['机构'] || 0} 个，合计 ${result.total || 0} 个`;
        renderSources();
      } catch (e) {
        meta.textContent = '加载失败：' + e.message;
      }
    }

    function renderSources() {
      const list = document.getElementById('sourcesList');
      const filtered = sources.filter(source => source.group === activeAccountGroup);
      if (!filtered.length) {
        list.innerHTML = '<div class="muted">暂无账号。</div>';
        return;
      }
      list.innerHTML = filtered.map((source) => {
        return `
          <div class="school-row">
            <div class="school-name">${esc(source.account_name)}</div>
            <div class="muted">${esc(source.group || '-')}</div>
            <input value="${esc(source.wx_name || '')}" readonly />
            <button onclick="runSingleWechat('${esc(source.wx_name || '')}')">抽取近7天</button>
          </div>
        `;
      }).join('');
    }

    async function runSingleWechat(wxName) {
      const status = document.getElementById('sourceStatus');
      status.textContent = '抽取中...';
      try {
        const result = await api('/api/wechat-api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ wx_names: [wxName], days: 7, limit_per_account: 100 })
        });
        status.textContent = `完成：文章 ${result.fetched} 条，保留 ${result.retained ?? result.worth_attention} 条，过滤 ${result.filtered ?? 0} 条，新增 ${result.written} 条`;
        document.getElementById('sourceFilter').value = 'wechat_api';
        await loadData();
      } catch (e) {
        status.textContent = '抽取失败：' + e.message;
      }
    }

    loadData().catch(err => {
      document.getElementById('tbody').innerHTML = `<tr><td colspan="6">加载失败：${esc(err.message)}</td></tr>`;
    });
    setInterval(() => {
      loadAutoStatus().catch(() => {});
      loadWechatDailyStatus().catch(() => {});
      loadData().catch(() => {});
    }, 30000);
  </script>
</body>
</html>
