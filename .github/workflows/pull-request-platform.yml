name: PR Platform Gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-platform-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-platform-check:
    name: Build and platform check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build platform
        run: npm run build

      - name: Check platform contracts
        run: npm run check:platform
