name: Commit Quality

on:
  push:

permissions:
  contents: read

concurrency:
  group: commit-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-server-tests:
    name: TypeScript and server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Unit tests import repository modules even when MySQL integration tests
      # are disabled. Supply an isolated, non-production configuration so the
      # fail-closed DB config can be evaluated without CI secrets.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sbl_jedi_ci
      DB_USERNAME: ci
      DB_PASSWORD: ci-not-used
      DB_FREFIX: ci_

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript
        run: npm run check:types

      - name: Run server tests
        run: npm run test:server
